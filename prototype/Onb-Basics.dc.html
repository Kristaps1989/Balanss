<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<title>Balanss — pamatdati</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html,body{overflow:hidden;width:390px;height:844px}
body{margin:0;background:#F7F3EE;color:#26231F;font-family:'Figtree',-apple-system,'Segoe UI',sans-serif}
a{color:#A9502A;text-decoration:none}a:hover{color:#8A3F1F}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.d{font-family:'Bricolage Grotesque','Figtree',-apple-system,sans-serif;letter-spacing:-0.02em}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sc{scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EE">
<div class="sc" style="scrollbar-width: none; overflow-x: hidden; position: absolute; top: 0; left: 0; right: 0; bottom: 112px; overflow-y: auto; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<a href="Onb-Login.dc.html" aria-label="Atpakaļ" style="width: 44px; height: 44px; display: flex; align-items: center; color: #26231F"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #E6DED3; overflow: hidden"><div style="width: 28%; height: 6px; background: #26231F"></div></div>
<div style="font-size: 13px; font-weight: 600; color: #6F685E">2/7</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 class="d" style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700">Pastāsti par sevi</h1>
<p style="margin: 0; font-size: 16px; color: #5E5850">Lai mērķi būtu reāli, nevis vispārīgi.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{steppers}}" as="s" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #EDE6DB; border-radius: 20px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-size: 13px; font-weight: 600; color: #6F685E">{{s.label}}</div>
<div class="d" style="font-size: 30px; font-weight: 700; line-height: 1.1">{{s.value}}</div>
<div style="font-size: 12px; color: #6F685E; height: 16px">{{s.unit}}</div>
<div style="display: flex; gap: 8px">
<button onClick="{{s.dec}}" aria-label="Mazāk" style="width: 44px; height: 44px; border-radius: 22px; background: #F2ECE3; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="M6 12h12"></path></svg></button>
<button onClick="{{s.inc}}" aria-label="Vairāk" style="width: 44px; height: 44px; border-radius: 22px; background: #F2ECE3; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="M12 6v12M6 12h12"></path></svg></button>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; font-weight: 700">Dzimums</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{sexes}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" style="flex-grow: 1; height: 52px; border-radius: 26px; font-size: 15px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}}">{{o.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; font-weight: 700">Cik daudz kustos ikdienā?</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{acts}}" as="o" hint-placeholder-count="4">
<button onClick="{{o.pick}}" style="min-height: 84px; border-radius: 20px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; background: {{o.bg}}; border: 1.5px solid {{o.bd}}">
<span style="font-size: 16px; font-weight: 700; color: #26231F">{{o.label}}</span>
<span style="font-size: 13px; color: #5E5850; line-height: 1.35">{{o.hint}}</span>
</button>
</sc-for>
</div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 40px; background: #F7F3EE">
<a href="Onb-Device.dc.html" style="height: 56px; border-radius: 28px; background: #26231F; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Tālāk</a>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { age: 34, h: 168, w: 71, sex: 'f', act: 'light' }; }
  renderVals() {
    const s = this.state;
    const set = (k, v) => () => this.setState({ [k]: v });
    const mk = (id, label) => ({ label, pick: set('sex', id), bg: s.sex === id ? '#26231F' : '#FFFFFF', fg: s.sex === id ? '#FFFFFF' : '#26231F', bd: s.sex === id ? '#26231F' : '#E3DBCF' });
    const ma = (id, label, hint) => ({ label, hint, pick: set('act', id), bg: s.act === id ? '#FBEBE1' : '#FFFFFF', bd: s.act === id ? '#D9693C' : '#EDE6DB' });
    return {
      steppers: [
        { label: 'Vecums', value: String(s.age), unit: 'gadi', dec: set('age', s.age - 1), inc: set('age', s.age + 1) },
        { label: 'Augums', value: String(s.h), unit: 'cm', dec: set('h', s.h - 1), inc: set('h', s.h + 1) },
        { label: 'Svars', value: String(s.w), unit: 'kg', dec: set('w', s.w - 1), inc: set('w', s.w + 1) }
      ],
      sexes: [mk('f', 'Sieviete'), mk('m', 'Vīrietis'), mk('x', 'Nenorādīt')],
      acts: [
        ma('sit', 'Pārsvarā sēžu', 'Birojs, maz kustību'),
        ma('light', 'Nedaudz kustos', 'Pastaigas, dažreiz sports'),
        ma('active', 'Aktīvi', 'Treniņi 3–4 reizes nedēļā'),
        ma('very', 'Ļoti aktīvi', 'Fizisks darbs vai ikdienas sports')
      ]
    };
  }
}
</script>
</body>
</html>
